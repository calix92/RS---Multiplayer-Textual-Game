syntax = "proto3";

message Empty {}

service PeerDiscovery {
    rpc RegisterPeer (Peer) returns (Empty);
    rpc GetPeers (Empty) returns (AllPeers);
}

message Peer {
  string uuid = 1;
  string address = 2;
}

message AllPeers {
    map<string, string> peers = 1;
}

service Chat {
  rpc Broadcast (BroadcastMessage) returns (Empty);
}

message BroadcastMessage {
  string from_uuid = 1;
  string text = 2;
}
