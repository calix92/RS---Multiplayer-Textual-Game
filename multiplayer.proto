syntax = "proto3";

message Empty {}

service PeerDiscovery {
    rpc RegisterPeer (Peer) returns (Empty);
    rpc GetPeers (Empty) returns (AllPeers);
    rpc RemovePeer (Peer) returns (Empty);
}

message Peer {
  string uuid = 1;
  string address = 2;
  string username = 3;
  int32 x = 4;
  int32 y = 5;
  string direction = 6;
}

message AllPeers {
    map<string, PeerInfo> peers = 1;
}

message PeerInfo {
  string address = 1;
  string username = 2;
  int32 x = 3;
  int32 y = 4;
  string direction = 5;
}

service Chat {
  rpc Broadcast (BroadcastMessage) returns (Empty);
}

message BroadcastMessage {
  string username = 1;
  string text = 2;
}

service Game {
  rpc SetPosition (Position) returns (Empty);
}

message Position {
  string uuid = 1;
  int32 x = 2;
  int32 y = 3;
  string direction = 4;
}
