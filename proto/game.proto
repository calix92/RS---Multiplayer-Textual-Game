syntax = "proto3";

service ChatService {
    rpc Chat(ChatMessage) returns (Empty);
    rpc Join(JoinRequest) returns (JoinResponse);
}

message ChatMessage {
    string sender = 1;
    string message = 2;
}

message JoinRequest {
    string address = 1;
}

message JoinResponse {
    repeated string peers = 1;
}

message Empty {}
